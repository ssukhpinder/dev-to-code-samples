[project]
name = "mcp-python-sync-thread-check"
version = "0.1.0"
description = "Offline verification of MCP Python SDK v2 sync-handler worker threads"
requires-python = ">=3.10"
dependencies = ["mcp==2.1.1"]

[project.optional-dependencies]
dev = ["pip-audit==2.10.1", "pytest==9.1.1", "ruff==0.16.5"]

[tool.setuptools]
py-modules = ["server", "verify"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
