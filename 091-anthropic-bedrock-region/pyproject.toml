[project]
name = "anthropic-bedrock-region-check"
version = "0.1.0"
description = "Offline verification of Anthropic Python SDK v1 Bedrock region resolution"
requires-python = ">=3.10"
dependencies = ["anthropic==1.2.0"]

[project.optional-dependencies]
dev = ["pip-audit==2.10.1", "pytest==9.1.1", "ruff==0.16.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
