[project]
name = "mcp-python-tool-errors"
version = "0.1.0"
description = "Verify MCP Python SDK tool and protocol error channels"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.1.1",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "ruff==0.16.5",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
